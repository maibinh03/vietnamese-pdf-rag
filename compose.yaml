services:
  qdrant:
    image: qdrant/qdrant:v1.13.3
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:0.6.2
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  api:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - embedding_cache:/models
    depends_on:
      qdrant:
        condition: service_started
      ollama:
        condition: service_started

volumes:
  qdrant_data:
  ollama_data:
  embedding_cache:
